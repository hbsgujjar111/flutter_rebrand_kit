# ==============================================================================
# FLUTTER REBRAND KIT CONFIGURATION
# Save this file in your Flutter root directory as "rebrand_kit.yaml"
# All fields are completely optional!
# ==============================================================================

# 1. Identity & Manifests
app_name: "Super App"
package_id: "com.acme.superapp"
version: "2.1.0+42"

# 2. Launcher Icons (Source should ideally be 1024x1024 PNG)
launcher_icon: "assets/branding/app_logo_1024.png"

# 3. Notification Icon (Auto-flattened to white silhouette with transparency)
notification_icon: "assets/branding/notification_icon.png"

# 4. Native Splash Screen (Auto-centered with safe boundaries)
splash_image: "assets/branding/app_logo_1024.png"
splash_color: "#0F172A"

# 5. Play Store Marketing Assets
play_store:
generate: true
background_color: "#0F172A"
tagline: "The fastest way to manage your work"